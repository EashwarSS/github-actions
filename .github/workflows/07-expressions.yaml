name: 07 - Using Expressions

on: 
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: '[debug] Print start-up'
              if: ${{ inputs.debug}}
              run: |
                echo "Triggered by : ${{ github.event_name }}"
                echo "Branch : ${{ github.ref_name }}
                echo "SHA : ${{ github.sha }}"
                echo "Runner OS : ${{ runner.os }}"
            - name: '[debug] Print when triggered from develop'
              if: ${{ inputs.debug && github.ref_name == 'develop' }}
              run: echo "This workflow was triggered from the develop branch."
            - name: Greeting
              run: echo "Hello from GitHub Actions!"  