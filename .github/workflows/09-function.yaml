name: 09 - Using Functions

on:
    pull_request:
    workflow_dispatch:

jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Print PR title
              run: echo " ${{ github.event.pull_request.title }} "
            - name: Print PR labels
              run: |
                cat <<EOF
                ${{ toJson(github.event.pull_request.labels) }}
                EOF
            - name: Test
              if: ${{ !cancelled() }}
              run: echo "This step runs only if the workflow is not cancelled."    
            - name: Bug step
              if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
              run: echo "This PR seems to be a bug fix."
            - name: Sleep for 20 seconds
              run: |
                echo "Sleeping for 20 seconds..."
                sleep(20)
            - name: Failing Step
              run: |
                echo "This step will fail"
                exit 0
            - name: This step will be skipped
              if: ${{ success() }}
              run: echo "This step runs only if the previous steps were successful."
            - name: I will execute
              if: ${{ failure() }}
              run: echo "This step runs if any of the previous steps failed."
            - name: I will execute always
              if: ${{ cancelled() }}
              run: echo "This step runs regardless of previous step outcomes."