name: 10 - Controlling Execution Flow
run-name: 10 - Execution Flow 

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                description: 'Whether unit tests'
                default: true

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and build
              run: |
                npm run lint
                npm run format:check
                npm run tsc:check
                npm run build
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Running unit tests
              run: echo "Running unit tests..."
            - name: Failing tests
              if: ${{ !inputs.pass-unit-tests }}
              run: exit 1
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs:
            - lint-build
            - unit-test
        steps:
            - name: Deploy to Non-Prod
              run: echo "Deploying to Non-Prod environment..."
    e2e-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-nonprod
        steps:
            - name: Running E2E Tests
              run: echo "Running E2E tests..."    
    load-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-nonprod
        steps:
            - name: Running Load Tests
              run: echo "Running Load tests..."    
    deploy-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests
            - load-tests
        steps:
            - name: Deploy to Prod
              run: echo "Deploying to Prod environment..."        