name: 02 - Wokflow Events
on: 
    push:
    pull_request:
    schedule:
        - cron: '*/5 * * * *'  # Runs every 5 minutes
    workflow_dispatch:    

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Echo Event Workflow
              run: echo "I've been triggered by a(n) ${{github.event_name}} event!"